# dualstack構成(v1との並行運用)のときだけコメントを外してください。
# /api/v1 などのレガシーパスを v1 の gateway へプロキシします。
# 詳細: https://square.concrnt.net/operator/migration/compose-dualstack/
  # - name: net.concrnt.legacy
