  # v2 のデータベース。v1 の postgres:16 から postgres:18 に更新されています。
  # データディレクトリのパスも /var/lib/postgresql/data から /var/lib/postgresql
  # へ変わっている点に注意してください(pg18 の既定レイアウト)。
  v2db:
    restart: always
    image: postgres:18-bookworm
    healthcheck:
      test: "pg_isready -U postgres"
      interval: 5s
      retries: 20
    volumes:
      - ./_composeData/db:/var/lib/postgresql
    environment:
      - "POSTGRES_PASSWORD=postgres"
      - "POSTGRES_DB=concrnt"
    expose:
      - 5432
    networks:
      - internal

  v2-redis:
    restart: always
    image: redis:7-bookworm
    volumes:
      - ./_composeData/redis:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20
    expose:
      - 6379
    networks:
      - internal

  v2-memcached:
    restart: always
    image: memcached:1.6-bookworm
    expose:
      - 11211
    networks:
      - internal

networks:
  # 移行時に v1 の db コンテナを接続するため、外部ネットワークには
  # 固定名を付けています(docker network connect で参照します)。
  external:
    name: concrnt-v2-external
  internal:
    internal: true
