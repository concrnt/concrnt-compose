services:
  # concrnt v2 の本体。v1 では ccgateway + ccapi の2つに分かれていた役割が、
  # v2 ではこの単一の `concrnt` バイナリに統合されています。
  # 自身がゲートウェイ(リバースプロキシ)を内包し、config.yaml の `services:`
  # に従って world-app や hyperproxy などへリクエストを振り分けます。
  # :8000 が唯一の公開ポート、:8001 は内部ヘルスチェック用(公開しないこと)。
  concrnt2:
    image: ghcr.io/concrnt/concrnt:latest
    restart: always
    depends_on:
      v2db:
        condition: service_healthy
      v2-redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - ./etc:/etc/concrnt/:ro
    networks:
      - external
      - internal

  # Web クライアント(world-app)。v1 の web-dashboard を置き換えるもので、
  # concrnt2 から `/` 配下として配信されます。
  world-app:
    image: ghcr.io/concrnt/concrnt-web:main
    restart: always
    expose:
      - 80
    networks:
      - external
      - internal

  # OGP/画像プロキシ。既定で有効です。
  hyperproxy:
    image: ghcr.io/concrnt/hyperproxy:v0.5.0
    restart: always
    environment:
      - "PORT=8000"
      - "MEMCACHED_HOST=v2-memcached:11211"
    expose:
      - 8000
    networks:
      - external
      - internal

  # v1 → v2 データ移行用の単発コンテナ。
  # 通常の `docker compose up` では起動しません(profiles: migration)。
  # 移行手順の詳細は下記ドキュメントを参照してください。
  #   https://square.concrnt.net/operator/migration/compose/
  #
  # 実行前に、稼働中の v1 データベースコンテナをこの構成のネットワークへ
  # `v1db` という別名で接続してください:
  #   docker network connect --alias v1db concrnt-v2-external <v1のdbコンテナ名>
  #
  # 下記の各引数(csid / fqdn / ignore-ccids 等)は自分の環境に合わせて
  # 必ず書き換えてください。
  migration:
    image: ghcr.io/concrnt/concrnt:v1.10.23
    profiles:
      - migration
    depends_on:
      v2db:
        condition: service_healthy
    command:
      - conctl
      - migrate
      - v1-to-v2
      - --from-csid
      - ccs1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - --from-dsn
      - postgres://postgres:postgres@v1db:5432/concrnt
      - --from-fqdn
      - example.tld
      - --dest-dsn
      - postgres://postgres:postgres@v2db:5432/concrnt
      - --dest-fqdn
      - example.tld
      # 移行したくないアカウント(例: v1用のAPIサーバーエージェントのCCID)があれば
      # コメントを外して指定します。複数指定する場合はカンマ区切り。
      # - --ignore-ccids
      # - con1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    volumes:
      - ./etc:/etc/concrnt/:ro
    networks:
      - external
      - internal

